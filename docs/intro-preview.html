<!doctype html>
<html lang="ko" translate="no">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>필름함 인트로 시안</title>
<style>
  body { margin: 0; background: #888; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  .board { display: flex; gap: 40px; justify-content: center; padding: 40px; flex-wrap: wrap; }
  .phone { width: 390px; height: 844px; border-radius: 54px; overflow: hidden; position: relative; box-shadow: 0 30px 80px rgb(0 0 0 / .35); }
  .label { text-align: center; color: #fff; font-weight: 600; margin-top: 14px; }

  /* ---- 인트로 화면 ---- */
  .intro { position: absolute; inset: 0; display: grid; place-items: center; overflow: hidden; }
  .intro.light { background: radial-gradient(120% 70% at 50% 38%, #fbf9f4 0%, #f2efe8 55%, #e9e4da 100%); color: #1a1816; }
  .intro.dark { background: #0c0b0a; color: #f2eee8; }
  /* 암실 안전등: 위에서 은은하게 번지는 붉은 빛 */
  .intro.dark::before { content: ""; position: absolute; inset: -20% -30% auto; height: 75%;
    background: radial-gradient(50% 50% at 50% 40%, rgb(222 84 46 / .30), rgb(222 84 46 / .08) 55%, transparent 75%);
    animation: glow 3.2s ease-in-out infinite alternate; }
  @keyframes glow { from { opacity: .75; } to { opacity: 1; } }
  /* 인화지 결 */
  .intro.light::after { content: ""; position: absolute; inset: 0; opacity: .5; mix-blend-mode: multiply;
    background-image: radial-gradient(rgb(0 0 0 / .035) 1px, transparent 1px); background-size: 3px 3px; }

  .stage { position: relative; display: grid; justify-items: center; gap: 30px; transform: translateY(-24px); }
  .mark { position: relative; width: 300px; height: 180px; animation: rise .9s cubic-bezier(.2,.8,.2,1) both; }
  .mark svg.can { position: absolute; left: 95px; top: 0; width: 110px; height: 180px; z-index: 2; filter: drop-shadow(0 10px 18px rgb(0 0 0 / .22)); }
  /* 필름 끝(텅)이 통에서 당겨져 나오는 것 = 로딩 */
  .leader { position: absolute; left: 190px; top: 53px; height: 79px; width: 0; overflow: hidden; z-index: 1;
    animation: pull 2.4s cubic-bezier(.45,.05,.2,1) .5s infinite; }
  .leader svg { display: block; height: 79px; width: 156px; }
  @keyframes pull { 0% { width: 0; } 70% { width: 104px; } 100% { width: 104px; opacity: 0; } }
  @keyframes rise { from { transform: translateY(14px) scale(.96); opacity: 0; } }

  .words { text-align: center; animation: rise .9s cubic-bezier(.2,.8,.2,1) .15s both; }
  .words h1 { margin: 0; font-size: 38px; font-weight: 800; letter-spacing: -0.02em; }
  .words p { margin: 8px 0 0; font-size: 12px; font-weight: 600; letter-spacing: .42em; text-indent: .42em; opacity: .5; }
  .intro.dark .words h1 { text-shadow: 0 0 30px rgb(222 84 46 / .25); }

  /* 아래 작은 컷 번호 (필름 가장자리 인쇄처럼) */
  .edge { position: absolute; bottom: 54px; left: 0; right: 0; text-align: center; font: 600 11px ui-monospace, "SF Mono", Menlo, monospace;
    letter-spacing: .28em; opacity: .38; animation: rise .9s ease .35s both; }
  .intro.dark .edge { color: #e9b9a7; opacity: .45; }
  .still .mark, .still .words, .still .edge { animation: none; }
  .still .leader { animation: none; width: 104px; }
</style>
</head>
<body>
<div class="board">
  <div>
    <div class="phone"><div class="intro light" id="light"></div></div>
    <div class="label">라이트</div>
  </div>
  <div>
    <div class="phone"><div class="intro dark" id="dark"></div></div>
    <div class="label">다크</div>
  </div>
</div>
<template id="content">
  <div class="stage">
    <div class="mark">
      <div class="leader">
        <svg viewBox="0 0 130 66" aria-hidden="true">
          <defs>
            <linearGradient id="base" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#c47637"/><stop offset=".5" stop-color="#a95a26"/><stop offset="1" stop-color="#8c4719"/></linearGradient>
          </defs>
          <path d="M0 0 H104 Q116 0 122 12 L130 26 V66 H0 Z" fill="url(#base)"/>
          <g fill="#3a1d0b" opacity=".75">
            <rect x="8" y="5" width="7" height="6" rx="1.5"/><rect x="24" y="5" width="7" height="6" rx="1.5"/><rect x="40" y="5" width="7" height="6" rx="1.5"/><rect x="56" y="5" width="7" height="6" rx="1.5"/><rect x="72" y="5" width="7" height="6" rx="1.5"/><rect x="88" y="5" width="7" height="6" rx="1.5"/>
            <rect x="8" y="55" width="7" height="6" rx="1.5"/><rect x="24" y="55" width="7" height="6" rx="1.5"/><rect x="40" y="55" width="7" height="6" rx="1.5"/><rect x="56" y="55" width="7" height="6" rx="1.5"/><rect x="72" y="55" width="7" height="6" rx="1.5"/><rect x="88" y="55" width="7" height="6" rx="1.5"/><rect x="104" y="55" width="7" height="6" rx="1.5"/><rect x="120" y="55" width="7" height="6" rx="1.5"/>
          </g>
        </svg>
      </div>
      <svg class="can" viewBox="0 0 92 150" aria-hidden="true">
        <defs>
          <linearGradient id="metal" x1="0" x2="1"><stop offset="0" stop-color="#1c1c1c"/><stop offset=".35" stop-color="#5a5a5a"/><stop offset=".6" stop-color="#2a2a2a"/><stop offset="1" stop-color="#111"/></linearGradient>
          <linearGradient id="label" x1="0" x2="1"><stop offset="0" stop-color="#d9d6cf"/><stop offset=".4" stop-color="#fbfaf7"/><stop offset="1" stop-color="#cfcbc3"/></linearGradient>
          <linearGradient id="band" x1="0" x2="1"><stop offset="0" stop-color="#b8401f"/><stop offset=".4" stop-color="#e45a33"/><stop offset="1" stop-color="#a93a1c"/></linearGradient>
        </defs>
        <rect x="30" y="0" width="32" height="10" rx="3" fill="url(#metal)"/>
        <rect x="4" y="8" width="84" height="14" rx="5" fill="url(#metal)"/>
        <rect x="6" y="20" width="80" height="108" fill="url(#label)"/>
        <text x="46" y="42" text-anchor="middle" font-size="10" font-weight="800" fill="#2a2522" font-family="Helvetica, Arial" letter-spacing="1.2">FILMCHEST</text>
        <text x="46" y="61" text-anchor="middle" font-size="15" font-weight="800" fill="#2a2522">필름함</text>
        <rect x="6" y="68" width="80" height="24" fill="url(#band)"/>
        <text x="46" y="86" text-anchor="middle" font-size="17" font-weight="900" fill="#fff" font-family="Helvetica, Arial">36</text>
        <text x="46" y="106" text-anchor="middle" font-size="6.5" fill="#6b625b" font-family="Helvetica, Arial" letter-spacing=".8">C-41 · 135-36</text>
        <g fill="#2a2522"><rect x="14" y="112" width="8" height="4"/><rect x="26" y="114" width="5" height="4"/><rect x="36" y="112" width="9" height="4"/><rect x="50" y="114" width="6" height="4"/><rect x="60" y="112" width="4" height="4"/><rect x="68" y="114" width="8" height="4"/></g>
        <rect x="4" y="126" width="84" height="14" rx="5" fill="url(#metal)"/>
      </svg>
    </div>
    <div class="words">
      <h1>필름함</h1>
      <p>FILMCHEST</p>
    </div>
  </div>
  <div class="edge">▸ 1 &nbsp;&nbsp; 1A &nbsp;&nbsp; ▸ 2 &nbsp;&nbsp; 2A</div>
</template>
<script>
  if (location.search.includes('still')) document.body.classList.add('still')
  for (const id of ['light', 'dark']) document.getElementById(id).append(document.getElementById('content').content.cloneNode(true))
</script>
</body>
</html>
