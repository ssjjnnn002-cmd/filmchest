<style>
:root{--bg:#F2F0EA;--card:#FBFAF7;--ink:#1d1b18;--muted:#8a857c;--accent:#E0552F}
@media (prefers-color-scheme:dark){:root{--bg:#131211;--card:#1f1d1b;--ink:#f2efe9;--muted:#9a948a}}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,"Pretendard",sans-serif;padding:20px 16px 60px}
h1{font-size:26px;margin:0 0 4px}p{color:var(--muted);margin:0 0 14px}
.seg{display:inline-flex;background:rgba(128,120,110,.15);border-radius:999px;padding:3px;margin-bottom:16px}
.seg label{padding:6px 16px;border-radius:999px;cursor:pointer}.seg input{display:none}.seg input:checked+span{color:#fff}
.seg label:has(input:checked){background:var(--accent);color:#fff}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--card);border-radius:18px;padding:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.pair{display:flex;gap:6px}figure{margin:0;flex:1;text-align:center}figure img{width:100%;max-width:170px}
figcaption{font-size:12px;color:var(--muted)}figure.new figcaption{color:var(--accent);font-weight:600}
.small{display:flex;gap:10px;align-items:center;justify-content:center;margin:6px 0}.small img{width:84px;height:84px}
.card small{display:block;text-align:center;color:var(--muted);font-size:11px}
#all{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}#all figure img{width:96px;height:96px}#all figcaption{font-size:11px;line-height:1.25}
.card b{display:block;text-align:center;font-size:14px}
</style></head><body>
<h1>필름 상자 시안 (평면)</h1>
<p>왼쪽은 지금 앱 그림, 오른쪽이 새 시안(상자 앞면)이에요. 작은 두 개는 실제 목록 크기(84)예요. 실제 상자를 베끼지 않고 종류마다 색 배치·글씨 느낌만 살렸어요. 아직 앱에는 넣지 않았어요.</p>

    const x = (S - w) / 2, y = (S - h) / 2;
    const fmt = format.startsWith("120") ? "120" : format === "110" ? "110" : format.startsWith("sheet") ? "4\xD75" : format.startsWith("instax") || format === "polaroid" ? "" : "135-36";
    ctx.fillStyle = "rgba(0,0,0,0.14)";
    ctx.beginPath();
    ctx.roundRect(x + S * 0.01, y + S * 0.012, w, h, S * 8e-3);
    ctx.fill();
    ctx.save();
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, S * 8e-3);
    ctx.clip();
    paint(ctx, { x, y, w, h, st, fmt });
    ctx.restore();
    ctx.strokeStyle = "rgba(0,0,0,0.12)";
    ctx.lineWidth = S * 3e-3;
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, S * 8e-3);
    ctx.stroke();
  }
  var tplOf = (st) => st.id;

  // ../prototypes/canister/entry.ts
  var pick = [
    "kodak-portra-400",
    "kodak-gold-200",
    "kodak-ektar-100",
    "kodak-trix-400",
    "fuji-c200",
    "ilford-hp5-plus",
    "cinestill-800t",
    "fuji-velvia-50",
    "ilford-delta-3200",
    "harman-phoenix-200",
    "kodak-ultramax-400",
    "kodak-ektachrome-e100",
    "fuji-400",
    "lomo-cn-400",
    "foma-fomapan-400",
    "kodak-vision3-500t",
    "fuji-instax-mini",
    "polaroid-600-color"
  ];
  function png(st, S, fmt) {
    const cv = document.createElement("canvas");
    cv.width = cv.height = S;
    drawBox(cv.getContext("2d"), st, S, fmt);
    return cv.toDataURL("image/png");
  }
  var fmtFor = (st, want) => want === "120" && st.formats.includes("120-66") ? "120-66" : st.formats[0];
  function render() {
    const want = document.querySelector("input[name=fmt]:checked").value;
    const grid = document.getElementById("grid");
    grid.innerHTML = "";
    for (const id of pick) {
      const st = films.find((f3) => f3.id === id);
      if (!st) continue;
      const f2 = fmtFor(st, want);
      const el = document.createElement("div");
      el.className = "card";
      el.innerHTML = `<div class="pair"><figure><img src="${canisterURL(st, f2, 360)}"><figcaption>\uC9C0\uAE08</figcaption></figure>
      <figure class="new"><img src="${png(st, 360, f2)}"><figcaption>\uC0C8 \uC2DC\uC548</figcaption></figure></div>
      <div class="small"><img src="${canisterURL(st, f2, 360)}"><img src="${png(st, 252, f2)}"></div><b>${st.brand} ${st.name}</b><small>${tplOf(st)}</small>`;
      grid.appendChild(el);
    }
    const all = document.getElementById("all");
    all.innerHTML = films.map((st) => `<figure><img src="${png(st, 252, fmtFor(st, want))}"><figcaption>${st.brand} ${st.name}</figcaption></figure>`).join("");
  }
  document.querySelectorAll("input[name=fmt]").forEach((r) => r.addEventListener("change", render));
  document.fonts.load("900 20px Archivo").then(() => document.fonts.ready).then(render);
})();
</script>
</body></html>
