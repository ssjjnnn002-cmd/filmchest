<style>
:root{--bg:#F2F0EA;--card:#FBFAF7;--ink:#1d1b18;--muted:#8a857c;--accent:#E0552F}
@media (prefers-color-scheme:dark){:root{--bg:#131211;--card:#1f1d1b;--ink:#f2efe9;--muted:#9a948a}}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,"Pretendard",sans-serif;padding:20px 16px 60px}
h1{font-size:26px;margin:0 0 4px}p{color:var(--muted);margin:0 0 14px}
.seg{display:inline-flex;background:rgba(128,120,110,.15);border-radius:999px;padding:3px;margin-bottom:16px}
.seg label{padding:6px 16px;border-radius:999px;cursor:pointer}.seg input{display:none}.seg input:checked+span{color:#fff}
.seg label:has(input:checked){background:var(--accent);color:#fff}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--card);border-radius:18px;padding:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.pair{display:flex;gap:6px}figure{margin:0;flex:1;text-align:center}figure img{width:100%;max-width:170px}
figcaption{font-size:12px;color:var(--muted)}figure.new figcaption{color:var(--accent);font-weight:600}
.small{display:flex;gap:10px;align-items:center;justify-content:center;margin:6px 0}.small img{width:84px;height:84px}
.card small{display:block;text-align:center;color:var(--muted);font-size:11px}
#all{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}#all figure img{width:96px;height:96px}#all figcaption{font-size:11px;line-height:1.25}
.card b{display:block;text-align:center;font-size:14px}
</style></head><body>
<h1>필름 상자 시안 (평면)</h1>
<p>왼쪽은 지금 앱 그림, 오른쪽이 새 시안(상자 앞면)이에요. 작은 두 개는 실제 목록 크기(84)예요. 실제 상자를 베끼지 않고 종류마다 색 배치·글씨 느낌만 살렸어요. 아직 앱에는 넣지 않았어요.</p>

    t2(ctx, kind, b.x + b.w * 0.93, b.y + b.h * 0.56, { size: b.h * 0.08, weight: 600, color: ink, align: "right" });
    t2(ctx, `${b.st.process} \xB7 ${b.fmt}`, b.x + b.w * 0.93, b.y + b.h * 0.8, { size: b.h * 0.065, weight: 600, color: ink, align: "right" });
  }
  function boldWide2(ctx, b, bg, ink, accent) {
    rect2(ctx, bg, b.x, b.y, b.w, b.h);
    const cx = b.x + b.w / 2;
    t2(ctx, b.st.brand.toUpperCase(), cx, b.y + b.h * 0.3, { size: b.h * 0.08, weight: 800, color: ink, align: "center", track: 0.12 });
    t2(ctx, nameOnly2(b.st).toUpperCase(), cx, b.y + b.h * 0.6, { size: b.h * 0.28, weight: 600, wdth: 110, color: ink, align: "center", maxW: b.w * 0.86 });
    t2(ctx, `ISO ${b.st.iso} ${b.st.process === "B&W" ? "BLACK & WHITE" : "COLOUR"} FILM`, cx, b.y + b.h * 0.76, { size: b.h * 0.075, weight: 800, color: accent, align: "center", track: 0.05 });
    t2(ctx, b.fmt, cx, b.y + b.h * 0.92, { size: b.h * 0.065, weight: 600, color: ink, align: "center" });
  }
  function instantBox2(ctx, b, bg, band, ink) {
    rect2(ctx, bg, b.x, b.y, b.w, b.h);
    rect2(ctx, band, b.x, b.y, b.w * 0.08, b.h);
    rect2(ctx, "#ffffff", b.x + b.w * 0.6, b.y + b.h * 0.18, b.w * 0.3, b.h * 0.62);
    rect2(ctx, band, b.x + b.w * 0.62, b.y + b.h * 0.22, b.w * 0.26, b.h * 0.42);
    ctx.strokeStyle = "rgba(0,0,0,0.15)";
    ctx.lineWidth = b.h * 0.01;
    ctx.strokeRect(b.x + b.w * 0.6, b.y + b.h * 0.18, b.w * 0.3, b.h * 0.62);
    t2(ctx, b.st.brand.toLowerCase(), b.x + b.w * 0.13, b.y + b.h * 0.3, { size: b.h * 0.11, weight: 800, color: ink });
    t2(ctx, nameOnly2(b.st), b.x + b.w * 0.13, b.y + b.h * 0.56, { size: b.h * 0.17, weight: 800, wdth: 85, color: ink, maxW: b.w * 0.44 });
    t2(ctx, `ISO ${b.st.iso}`, b.x + b.w * 0.13, b.y + b.h * 0.85, { size: b.h * 0.08, weight: 700, color: ink });
  }
  var KY2 = "#F6C000";
  var KP2 = "#9B6CB6";
  function paint2(ctx, b) {
    const st = b.st, s2 = st.style, id = st.id;
    if (/portra/.test(id)) return proWide2(ctx, b, id.includes("800") ? "#B8732E" : id.includes("160") ? "#C9A3D8" : KP2, KY2, "#ffffff", "#1a1a1a");
    if (/ektacolor|kodak-proimage/.test(id)) return proWide2(ctx, b, s2.band, KY2, "#ffffff", "#1a1a1a");
    if (/ektar/.test(id)) return darkCenter2(ctx, b, "#5A1A1E", KY2, "#f3e6d8", "#B0161E");
    if (/ektachrome|elite-chrome/.test(id)) return darkCenter2(ctx, b, "#1C1C1C", KY2, "#f3f3f3", "#1a1a1a");
    if (id === "kodak-trix-400") return bwCode2(ctx, b, KY2, "#1F6B3A", "#C8102E", "TX");
    if (/tmax|plus-x/.test(id)) return bwCode2(ctx, b, KY2, s2.band, "#C8102E", id.includes("plus-x") ? "PX" : id.includes("p3200") ? "TMZ" : st.iso === 100 ? "TMX" : "TMY");
    if (id === "kodak-bw400cn") return bwCode2(ctx, b, "#f4efe4", "#1a1a1a", "#C8102E", "CN");
    if (/vision3|double-x|cinestill/.test(id)) return cineBig2(ctx, b, st.brand === "CineStill" ? s2.band === "#D7262E" ? "#D7262E" : s2.band : "#232323", "#ffffff", "#111111");
    const kc = {
      "kodak-gold-200": ["#B4389F", ["FILM FOR COLOR PRINTS"]],
      "kodak-gold-100": ["#B4389F", ["FILM FOR COLOR PRINTS"]],
      "kodak-colorplus-200": ["#E0241B", ["FILM \u2022 FILME", "PEL\xCDCULA PARA FOTOS A COLOR"]],
      "kodak-ultramax-400": ["#1F5FB5", ["FILM FOR COLOR PRINTS"]],
      "kodak-max-800": ["#1B1B1B", ["FILM FOR COLOR PRINTS"]],
      "kodak-kodacolor-100": ["#E87722", ["FILM FOR COLOR PRINTS"]],
      "kodak-kodacolor-200": ["#2E8B57", ["FILM FOR COLOR PRINTS"]]
    };
    if (kc[id]) return kodakConsumer2(ctx, b, kc[id][0], kc[id][1]);
    if (st.brand === "Kodak") return consumerStripe2(ctx, b, KY2, s2.band, KY2, "#1a1a1a", "#C8102E");
    if (st.brand === "Fujifilm") {
      if (st.process === "E-6") return slidePanel2(ctx, b, s2.body, s2.band === "#F5F5F2" ? s2.body : s2.band, "#ffffff", "#1a1a1a");
      if (st.process === "instant") return instantBox2(ctx, b, "#f7f7f4", s2.band, "#1a1a1a");
      if (st.process === "B&W") return bwHeavy2(ctx, b, "#f4f4f1", "#141414", "#ffffff");
      if (/pro-|natura/.test(id)) return darkCenter2(ctx, b, s2.body === "#EDEDED" ? "#2E6B3A" : s2.body, "#EDEDED", "#ffffff", "#1a1a1a");
      return whiteTag2(ctx, b, "#ffffff", /c200|superia/.test(id) ? "#0C9A48" : s2.band, "#D7262E", "#ffffff", "#0C9A48");
    }
    if (st.brand === "Ilford" || st.brand === "Kentmere") {
      if (/delta|xp2/.test(id)) return outlineDelta2(ctx, b, "#ECECEA", "#141414", s2.band === "#1B1B1B" ? "#9A9A9A" : s2.band);
      return bwHeavy2(ctx, b, "#f7f7f4", "#141414", id.includes("hp5") ? "#2BB673" : s2.band);
    }
    if (st.process === "instant") return instantBox2(ctx, b, "#f7f7f4", s2.band, "#1a1a1a");
    if (st.process === "B&W") return /adox|rollei|foma|kosmo|jch|shanghai|ferrania|agfa/.test(id) ? bwHeavy2(ctx, b, s2.body === "#1B1B1B" ? "#f4f4f1" : s2.body, "#141414", s2.band) : bwHeavy2(ctx, b, "#f4f4f1", "#141414", s2.band);
    if (st.process === "E-6") return slidePanel2(ctx, b, s2.body, s2.band, "#ffffff", "#ffffff");
    const bg = /F5F5F2|F4EFE4|EDEDED/i.test(s2.body) ? s2.band : s2.body;
    return boldWide2(ctx, b, bg, "#ffffff", /F5F5F2|FFFFFF/i.test(s2.bandText) && bg === s2.band ? "#ffffff" : s2.bandText === bg ? "#ffffff" : s2.bandText);
  }
  function drawBox2(ctx, st, S, format = "135") {
    const w = S * 0.94, h = w / 1.6;
    const x = (S - w) / 2, y = (S - h) / 2;
    const fmt = boxFormatText2(format);
    ctx.fillStyle = "rgba(0,0,0,0.14)";
    ctx.beginPath();
    ctx.roundRect(x + S * 0.01, y + S * 0.012, w, h, S * 8e-3);
    ctx.fill();
    ctx.save();
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, S * 8e-3);
    ctx.clip();
    paint2(ctx, { x, y, w, h, st, fmt });
    ctx.restore();
    ctx.strokeStyle = "rgba(0,0,0,0.12)";
    ctx.lineWidth = S * 3e-3;
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, S * 8e-3);
    ctx.stroke();
  }
  var boxFormatText2 = (format) => format.startsWith("120") ? "120" : format === "110" ? "110" : format === "sheet-810" ? "8\xD710" : format.startsWith("sheet") ? "4\xD75" : format.startsWith("instax") || format === "polaroid" ? "" : "135-36";

  // ../prototypes/canister/entry.ts
  var pick = [
    "kodak-portra-400",
    "kodak-gold-200",
    "kodak-ektar-100",
    "kodak-trix-400",
    "fuji-c200",
    "ilford-hp5-plus",
    "cinestill-800t",
    "fuji-velvia-50",
    "ilford-delta-3200",
    "harman-phoenix-200",
    "kodak-ultramax-400",
    "kodak-ektachrome-e100",
    "fuji-400",
    "lomo-cn-400",
    "foma-fomapan-400",
    "kodak-vision3-500t",
    "fuji-instax-mini",
    "polaroid-600-color"
  ];
  function png(st, S, fmt) {
    const cv = document.createElement("canvas");
    cv.width = cv.height = S;
    drawBox2(cv.getContext("2d"), st, S, fmt);
    return cv.toDataURL("image/png");
  }
  var fmtFor = (st, want) => want === "120" && st.formats.includes("120-66") ? "120-66" : st.formats[0];
  function render() {
    const want = document.querySelector("input[name=fmt]:checked").value;
    const grid = document.getElementById("grid");
    grid.innerHTML = "";
    for (const id of pick) {
      const st = films.find((f3) => f3.id === id);
      if (!st) continue;
      const f2 = fmtFor(st, want);
      const el = document.createElement("div");
      el.className = "card";
      el.innerHTML = `<div class="pair"><figure><img src="${canisterURL(st, f2, 360)}"><figcaption>\uC9C0\uAE08</figcaption></figure>
      <figure class="new"><img src="${png(st, 360, f2)}"><figcaption>\uC0C8 \uC2DC\uC548</figcaption></figure></div>
      <div class="small"><img src="${canisterURL(st, f2, 360)}"><img src="${png(st, 252, f2)}"></div><b>${st.brand} ${st.name}</b>`;
      grid.appendChild(el);
    }
    const all = document.getElementById("all");
    all.innerHTML = films.map((st) => `<figure><img src="${png(st, 252, fmtFor(st, want))}"><figcaption>${st.brand} ${st.name}</figcaption></figure>`).join("");
  }
  document.querySelectorAll("input[name=fmt]").forEach((r) => r.addEventListener("change", render));
  document.fonts.load("900 20px Archivo").then(() => document.fonts.ready).then(render);
})();
</script>
