<!doctype html>
<html lang="ko" translate="no">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="google" content="notranslate" />
<meta name="theme-color" content="#0b0b0c" />
<title>노출계 테스트</title>
<style>
  :root {
    --bg: #0b0b0c; --panel: #161618; --line: #2a2a2e; --text: #f2f0ec; --sub: #8d8a85;
    --orange: #ff6b1f; --ok: #4cd964; --warn: #ff453a; --print: #f3a256;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    -webkit-user-select: none; user-select: none; overscroll-behavior: none;
    padding: env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 10px);
    height: 100dvh; box-sizing: border-box; overflow: hidden;
  }
  button { font-family: inherit; color: inherit; }
  .wrap { max-width: 440px; height: 100%; margin: 0 auto; padding: 8px 16px 0; display: flex; flex-direction: column; gap: 8px; box-sizing: border-box; }
  .wrap > * { flex: none; min-width: 0; }
  /* 한 화면에 다 들어가게: 남는 높이만큼 파인더가 줄어든다 */
  .wrap > .finderbox { flex: 1 1 0; min-height: 90px; display: flex; align-items: center; justify-content: center; container-type: size; }
  .finderbox .finder { height: min(100cqh, calc(100cqw / 1.5)); width: auto; flex: none; }

  /* 헤더 */
  .head { display: flex; align-items: center; gap: 8px; }
  .head .t { flex: 1; min-width: 0; }
  .head h1 { margin: 0; font-size: 17px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .back { flex: none; width: 36px; height: 36px; margin-left: -6px; border: 0; border-radius: 50%; background: var(--panel); display: grid; place-items: center; }
  .back svg { width: 20px; height: 20px; }
  .back[hidden] { display: none; }
  /* 앱 안 아이폰: 카메라 화면은 웹 화면 아래에 깔린다. 파인더 자리만 비우고, 모서리는 흐린 접안부 모양으로 덮는다 */
  html.native, html.native body { background: transparent; }
  html.native .finder { background: transparent; -webkit-mask: none; mask: none; }
  html.native .finder .scene { display: none; }
  .finder .feather { display: none; }
  html.native .finder .feather { display: block; position: absolute; inset: -1px; pointer-events: none; background: var(--bg);
    -webkit-mask: linear-gradient(#000 0 0), var(--eyepiece) center / 100% 100% no-repeat; -webkit-mask-composite: xor;
    mask: linear-gradient(#000 0 0) exclude, var(--eyepiece) center / 100% 100% no-repeat; }
  .head .film { font-size: 12px; color: var(--sub); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tog { position: relative; display: grid; grid-template-columns: 1fr 1fr 1fr; width: 162px; border: 0; padding: 3px; border-radius: 99px; background: var(--panel); flex: none; }
  .tog i { position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc((100% - 6px) / 3); border-radius: 99px; background: #3a3a3e; box-shadow: 0 1px 4px rgb(0 0 0 / .4);
    transition: transform .32s cubic-bezier(.3,1.35,.5,1); }
  .tog.center i { transform: translateX(100%); }
  .tog.avg i { transform: translateX(200%); }
  .tog span { position: relative; padding: 7px 0; font-size: 13px; font-weight: 700; color: var(--sub); transition: color .25s; }
  .tog.spot span:nth-of-type(1), .tog.center span:nth-of-type(2), .tog.avg span:nth-of-type(3) { color: var(--text); }

  /* 파인더: 둥근 네모 접안부 안에 바늘·화각 다이얼·테스트 밝기까지 */
  .finder { position: relative; aspect-ratio: 3 / 2; background: #000; touch-action: none; -webkit-mask: var(--eyepiece) center / 100% 100% no-repeat; mask: var(--eyepiece) center / 100% 100% no-repeat; }
  .finder:not(.spot) .cross { opacity: 0; }
  /* 중앙 중점 측광: 가운데 동그라미 쪽을 더 많이 본다 */
  .finder .ccircle { position: absolute; left: 50%; top: 50%; width: 34%; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%;
    border: 1px solid rgb(255 238 190 / .75); pointer-events: none; opacity: 0; transition: opacity .2s; }
  .finder.center .ccircle { opacity: 1; }
  .finder .cammsg { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 62%; text-align: center; background: rgb(0 0 0 / .6); border-radius: 14px; padding: 12px; z-index: 2; }
  .finder .cammsg[hidden] { display: none; }
  .finder .cammsg p { margin: 0 0 8px; font-size: 12px; line-height: 1.4; }
  .finder .cammsg button { border: 0; background: var(--orange); color: #111; font-size: 13px; font-weight: 700; padding: 8px 14px; border-radius: 99px; }
  .finder .cammsg button[hidden] { display: none; }
  .finder .evflash { position: absolute; left: 50%; bottom: 9%; transform: translateX(-50%); font-size: 11px; font-weight: 700; color: #fff; background: rgb(0 0 0 / .45); padding: 4px 8px; border-radius: 99px; opacity: 0; transition: opacity .3s; pointer-events: none; }
  .finder .evflash.on { opacity: 1; transition: none; }
  .finder .scene { position: absolute; inset: 0; }
  .finder video, .finder canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: filter .25s; }
  .finder .vignette { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse 75% 78% at 50% 50%, transparent 52%, rgb(0 0 0 / .32) 74%, rgb(0 0 0 / .78) 100%); }
  .finder .bright { position: absolute; left: 50%; top: 50%; width: 64%; height: 70%; transform: translate(-50%, -50%); pointer-events: none;
    border: 1.5px solid rgb(255 226 140 / .9); border-radius: 3px; box-shadow: 0 0 6px rgb(255 220 140 / .35); }
  .finder .bright::before { content: ""; position: absolute; left: -1px; top: 8%; width: 10%; border-top: 1px dashed rgb(255 226 140 / .55); }
  .finder .cross { position: absolute; width: 22px; height: 22px; transform: translate(-50%, -50%); pointer-events: none; transition: left .25s cubic-bezier(.2,.8,.2,1), top .25s cubic-bezier(.2,.8,.2,1), opacity .2s; }
  .finder .cross.drag { transition: none; }
  .finder .cross::before, .finder .cross::after { content: ""; position: absolute; background: rgb(255 238 190 / .95); box-shadow: 0 0 3px rgb(0 0 0 / .5); }
  .finder .cross::before { left: 50%; top: 0; bottom: 0; width: 1.5px; margin-left: -.75px; }
  .finder .cross::after { top: 50%; left: 0; right: 0; height: 1.5px; margin-top: -.75px; }
  .finder .gauge { position: absolute; left: 4%; top: 6%; bottom: 6%; width: 12%; pointer-events: none; opacity: .92; }
  .finder .gauge svg { width: 100%; height: 100%; display: block; }
  .finder .zoomdial { position: absolute; right: 0; top: 0; bottom: 0; width: 18%; opacity: .82; touch-action: none; cursor: ns-resize; z-index: 3; background: rgb(0 0 0 / .02); }
  .finder .zoomdial svg { position: absolute; right: 8%; top: 6%; width: 78%; height: 88%; display: block; }
  .finder .led { position: absolute; left: 19%; bottom: 12%; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 10px var(--ok); transition: background .2s, box-shadow .2s; }
  .finder .led.red { background: var(--warn); box-shadow: 0 0 10px var(--warn); }
  .finder .focal { position: absolute; right: calc(18% + 7px); top: calc(15% + 6px); font-size: 12px; font-weight: 700; color: rgb(255 238 190 / .95); text-shadow: 0 1px 3px rgb(0 0 0 / .6); font-variant-numeric: tabular-nums; pointer-events: none; }
  .finder .simbar { position: absolute; left: 50%; bottom: 4%; width: 46%; transform: translateX(-50%); display: flex; align-items: center; gap: 6px;
    font-size: 10px; font-weight: 700; color: rgb(255 255 255 / .7); text-shadow: 0 1px 2px rgb(0 0 0 / .7); font-variant-numeric: tabular-nums; }
  .finder .simbar input { flex: 1; min-width: 0; height: 14px; margin: 0; accent-color: #d8d3cb; opacity: .8; }
  .finder .fire { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; }
  .finder .fire.go { animation: fire .16s ease-out; }
  @keyframes fire { 30% { opacity: .55 } 100% { opacity: 0 } }

  .info { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 2px; }
  .info .state { font-size: 20px; font-weight: 800; letter-spacing: -.02em; }
  .state.over { color: #ffb340; } .state.under { color: #64b5ff; } .state.ok { color: var(--ok); }
  .info .ev { font-size: 12px; color: var(--sub); margin-top: 2px; font-variant-numeric: tabular-nums; }
  .hold { border: 1px solid var(--line); background: var(--panel); font-size: 13px; font-weight: 600; padding: 9px 14px; border-radius: 99px; flex: none; }
  .hold.on { background: var(--orange); border-color: var(--orange); color: #111; }
  .infobtns { display: flex; gap: 6px; flex: none; }
  .flash { display: flex; align-items: center; gap: 4px; border: 1px solid var(--line); background: var(--panel); color: var(--sub); font-size: 13px; font-weight: 600; padding: 0 10px; border-radius: 99px; transition: background .2s, color .2s, border-color .2s; }
  .flash svg { width: 15px; height: 15px; }
  .flash.on { background: #ffd23f; border-color: #ffd23f; color: #111; }
  .filt.on { background: #9ec9ff; border-color: #9ec9ff; color: #111; }
  .chips button small { font-size: 10px; font-weight: 700; opacity: .7; margin-left: 3px; }
  .chips button.rec { box-shadow: inset 0 0 0 1.5px var(--orange); }
  .chips.wrap { flex-wrap: wrap; overflow: visible; }
  .sheet .memo { width: 100%; margin-top: 8px; border: 0; border-radius: 10px; background: #2a2a2e; color: var(--text); font: 15px/1.4 inherit; font-family: inherit; padding: 10px 12px; }
  .cell .fl { position: absolute; right: 4px; top: 3px; width: 11px; height: 11px; color: #ffd23f; }
  .cell .fl svg { width: 100%; height: 100%; display: block; }

  /* 링 */
  .rings { display: grid; gap: 6px; }
  .ringrow { display: grid; grid-template-columns: 66px minmax(0, 1fr); gap: 6px; }
  .mbtn { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 0 2px; display: grid; place-content: center; gap: 3px; text-align: center; transition: background .2s, border-color .2s; }
  .mbtn span { font-size: 13px; font-weight: 700; }
  .mbtn small { font-size: 10px; font-weight: 700; color: var(--sub); min-height: 12px; white-space: nowrap; }
  .mbtn.on { background: rgb(255 107 31 / .16); border-color: var(--orange); }
  .mbtn.on span { color: var(--orange); }
  .ring { position: relative; height: 50px; border-radius: 10px; overflow: hidden; background: #101011; touch-action: none; cursor: grab; }
  .ring.short { height: 44px; }
  .ring .ridges, .ring .labels { position: absolute; left: 0; right: 0; }
  .ring .ridges { top: 0; height: 16px; background: #1c1c1e; }
  .ring.short .ridges { height: 12px; }
  .ring .labels { top: 16px; bottom: 0; background: linear-gradient(#141415, #0d0d0e); }
  .ring.short .labels { top: 12px; }
  .ring .ridge { position: absolute; top: 2px; bottom: 2px; width: 3px; margin-left: -1.5px; border-radius: 1px; background: #3d3d41; }
  .ring .lab { position: absolute; top: 50%; font: 700 16px/1 -apple-system, sans-serif; color: #e9e6e0; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .ring .shade { position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(90deg, rgb(0 0 0 / .92), rgb(0 0 0 / .1) 28%, rgb(255 255 255 / .04) 50%, rgb(0 0 0 / .1) 72%, rgb(0 0 0 / .92)),
                linear-gradient(rgb(255 255 255 / .06), transparent 30%, transparent 75%, rgb(0 0 0 / .4)); }
  .ring .mark { position: absolute; left: 50%; top: 16px; margin-left: -5px; border: 5px solid transparent; border-top-color: var(--orange); }
  .ring.short .mark { top: 12px; }
  .ringrow.auto .ring { cursor: default; }
  .ringrow.auto .lab { color: #8f8b84; }
  .ringrow.auto .ring .mark { border-top-color: #666; }

  /* 조작부: 되감기 노브 · 카운터 · 셔터+레버 */
  .controls { position: relative; z-index: 3; }
  .controls svg { display: block; width: 100%; height: auto; max-height: 92px; overflow: visible; }
  #shutterBtn { cursor: pointer; }
  #shutterBtn .disc { transition: transform .09s ease-out, filter .09s; transform-box: fill-box; transform-origin: center; }
  #shutterBtn.down .disc { transform: scale(.88); filter: brightness(.8); }
  #lever { transform-box: view-box; transform-origin: 290px 52px; transition: transform .34s cubic-bezier(.35,0,.25,1); }
  #lever.out { transform: rotate(-125deg); transition-timing-function: cubic-bezier(.4,.1,.3,1); }
  #rewind { transform-box: view-box; transform-origin: 70px 52px; transition: transform .6s cubic-bezier(.35,0,.25,1); }

  /* 필름 */
  .stripwrap { position: relative; margin: 0 -16px; }
  .canister { position: absolute; left: -34px; top: -10px; width: 72px; height: 132px; pointer-events: none; z-index: 2; filter: drop-shadow(4px 0 6px rgb(0 0 0 / .55)); }
  .canister svg { width: 100%; height: 100%; display: block; }
  .strip { position: relative; height: 112px; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x proximity;
    scrollbar-width: none; -webkit-overflow-scrolling: touch; touch-action: pan-x; }
  .strip::-webkit-scrollbar { display: none; }
  .track { display: flex; height: 100%; width: max-content; padding: 0 calc(50% - 52px) 0 0; }
  .cell { position: relative; flex: 0 0 104px; height: 100%; background: #2a1a0f; scroll-snap-align: center; }
  .cell::before, .cell::after { content: ""; position: absolute; left: 0; right: 0; height: 8px;
    background: repeating-linear-gradient(90deg, #2a1a0f 0 6px, var(--bg) 6px 13px, #2a1a0f 13px 17.33px); }
  .cell::before { top: 4px; } .cell::after { bottom: 4px; }
  .cell .num { position: absolute; top: 14px; left: 8px; font: 700 9px/1 ui-monospace, "SF Mono", Menlo, monospace; color: var(--print); opacity: .85; }
  .cell .frame { position: absolute; left: 6px; right: 6px; top: 26px; height: 60px; border-radius: 4px; background: #1a100a;
    display: grid; place-content: center; gap: 2px; text-align: center; border: 1.5px solid transparent; transition: border-color .2s, background .2s; }
  .cell .frame b { font: 800 17px/1.1 -apple-system, sans-serif; color: #f6e6d4; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .cell .frame i { font-style: normal; font: 700 13px/1.1 -apple-system, sans-serif; color: #f6e6d4; opacity: .85; font-variant-numeric: tabular-nums; }
  .cell .frame em { font-style: normal; font: 800 11px/1.2 -apple-system, sans-serif; color: var(--print); }
  .cell .frame .auto { font: 800 13px/1 -apple-system, sans-serif; color: #f6e6d4; opacity: .5; letter-spacing: .08em; }
  .cell.shot .frame { background: #3a2414; }
  .cell.next .frame { border-color: rgb(255 255 255 / .55); border-style: dashed; }
  .cell.next .frame::after { content: "다음"; font: 700 11px/1 -apple-system, sans-serif; color: rgb(255 255 255 / .55); }
  .cell.leader:not(.shot) .frame { background: #4a2810; }
  .cell.leader:not(.shot) .num { opacity: .5; }
  .tongue { flex: none; height: 100%; }
  .tail { background: #2a1a0f !important; }
  .leadfog, .tail { flex: none; width: 30px; height: 100%; background: #3b2210;
    -webkit-mask: linear-gradient(#000 0 0) top / 100% 4px no-repeat, linear-gradient(#000 0 0) bottom / 100% 4px no-repeat, linear-gradient(#000 0 0) center / 100% 88px no-repeat,
      repeating-linear-gradient(90deg, #000 0 6px, transparent 6px 13px, #000 13px 17.33px) top 4px left 0 / 100% 8px no-repeat, repeating-linear-gradient(90deg, #000 0 6px, transparent 6px 13px, #000 13px 17.33px) bottom 4px left 0 / 100% 8px no-repeat;
    mask: linear-gradient(#000 0 0) top / 100% 4px no-repeat, linear-gradient(#000 0 0) bottom / 100% 4px no-repeat, linear-gradient(#000 0 0) center / 100% 88px no-repeat,
      repeating-linear-gradient(90deg, #000 0 6px, transparent 6px 13px, #000 13px 17.33px) top 4px left 0 / 100% 8px no-repeat, repeating-linear-gradient(90deg, #000 0 6px, transparent 6px 13px, #000 13px 17.33px) bottom 4px left 0 / 100% 8px no-repeat; }
  .tongue svg { display: block; height: 100%; width: auto; }
  .cell .pen { position: absolute; right: 9px; top: 12px; font-size: 9px; color: var(--print); opacity: .8; }
  /* 키가 작은 폰(아이폰 SE 등): 링·버튼을 조금 줄여 파인더 자리를 남긴다 */
  @media (max-height: 760px) {
    .wrap { gap: 6px; }
    .ring { height: 42px; }
    .ring.short { height: 38px; }
    .rings { gap: 4px; }
    .info .state { font-size: 17px; }
    .controls svg { max-height: 74px; }
    .endbtn { padding: 11px 0 !important; }
  }
  .endbtn { border: 0; border-radius: 14px; padding: 15px 0; font-size: 16px; font-weight: 700; background: var(--panel); color: var(--text); margin-top: 4px; }
  .endbtn:disabled { color: var(--sub); }
  .striphint { text-align: center; font-size: 11px; color: var(--sub); margin-top: -4px; }

  .src { font-size: 11px; color: var(--sub); text-align: center; }

  /* 시트 */
  .dim { position: fixed; inset: 0; background: rgb(0 0 0 / .5); opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 20; }
  .dim.on { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; background: #1c1c1e; border-radius: 18px 18px 0 0; padding: 10px 16px calc(env(safe-area-inset-bottom) + 16px);
    transform: translateY(105%); transition: transform .32s cubic-bezier(.2,.8,.2,1); max-width: 480px; margin: 0 auto; }
  .sheet.on { transform: none; }
  .sheet .grab { width: 36px; height: 5px; border-radius: 3px; background: #48484c; margin: 0 auto 12px; }
  .sheet.down { max-height: 92dvh; overflow-y: auto; top: 0; bottom: auto; border-radius: 0 0 18px 18px; padding: calc(env(safe-area-inset-top) + 16px) 16px 10px; transform: translateY(-105%); }
  .sheet.down.on { transform: none; }
  .sheet.down .grab { margin: 14px auto 0; }
  .sheet h2 { margin: 0 0 2px; font-size: 18px; }
  .sheet .meta { font-size: 12px; color: var(--sub); margin-bottom: 4px; }
  .sheet .lbl { font-size: 12px; color: var(--sub); font-weight: 600; margin: 12px 0 6px; }
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: #2a2a2e; border-radius: 10px; padding: 2px; }
  .seg button { border: 0; background: none; color: var(--sub); font-size: 13px; font-weight: 600; padding: 9px 0; border-radius: 8px; line-height: 1.25; }
  .seg button small { display: block; font-size: 10px; font-weight: 600; opacity: .8; }
  .seg button.on { background: #48484c; color: var(--text); }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chips button { flex: none; border: 0; background: #2a2a2e; font-size: 14px; font-weight: 600; padding: 9px 12px; border-radius: 10px; font-variant-numeric: tabular-nums; }
  .chips button.on { background: var(--orange); color: #111; }
  .sheet .note { font-size: 12px; color: var(--sub); padding: 8px 0 0; }
  .sheet .actions { display: grid; grid-template-columns: 1fr 2fr; gap: 8px; margin-top: 18px; }
  .sheet .actions.one { grid-template-columns: 1fr; }
  .modal { position: fixed; left: 50%; top: 50%; z-index: 21; width: min(340px, calc(100% - 40px)); background: #1c1c1e; border-radius: 20px; padding: 18px 16px 16px;
    transform: translate(-50%, -46%) scale(.94); opacity: 0; pointer-events: none; transition: transform .28s cubic-bezier(.2,.9,.3,1.15), opacity .2s; box-shadow: 0 20px 60px rgb(0 0 0 / .5); }
  .modal.on { transform: translate(-50%, -50%); opacity: 1; pointer-events: auto; }
  .modal .pair { display: grid; gap: 6px; }
  .modal .pcam { background: #2a2a2e; border-radius: 14px; padding: 10px 12px; }
  .modal .pcam small { display: block; font-size: 11px; color: var(--sub); }
  .modal .pcam b { font-size: 15px; }
  .modal .roll { margin-top: 0; }
  .modal h3 { margin: 18px 0 6px; font-size: 17px; text-align: center; }
  .modal .hint { margin: 0 0 14px; font-size: 12px; line-height: 1.45; color: var(--sub); text-align: center; }
  .modal .yn { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .modal .yn button { border: 1.5px solid var(--line); background: #2a2a2e; border-radius: 12px; padding: 12px 0; font-size: 15px; font-weight: 700; transition: border-color .2s, background .2s, color .2s; }
  .modal .yn button.on { border-color: var(--orange); background: rgb(255 107 31 / .16); color: var(--orange); }
  .modal .known { margin: 14px 0 0; font-size: 12px; color: var(--sub); text-align: center; }
  .modal .go { width: 100%; margin-top: 12px; border: 0; border-radius: 12px; padding: 14px 0; font-size: 15px; font-weight: 700; background: var(--orange); color: #111; transition: opacity .2s; }
  .modal .go:disabled { opacity: .35; }
  .roll { display: flex; align-items: center; gap: 12px; background: #2a2a2e; border-radius: 14px; padding: 12px; margin-top: 10px; }
  .roll .can { width: 34px; height: 46px; border-radius: 6px; background: linear-gradient(90deg, #c9c4ba, #f6f3ec 45%, #bdb8ae); position: relative; flex: none; }
  .roll .can::before, .roll .can::after { content: ""; position: absolute; left: -2px; right: -2px; height: 6px; border-radius: 3px; background: linear-gradient(90deg, #333, #777 45%, #222); }

<script>
// ───────── 테스트 카메라 ─────────
const stops = (from, to) => [1/8000, 1/4000, 1/2000, 1/1000, 1/500, 1/250, 1/125, 1/60, 1/30, 1/15, 1/8, 1/4, 1/2, 1, 2, 4, 8, 15].filter((t) => t >= from - 1e-9 && t <= to + 1e-9)
const aps = (from, to) => [1.4, 2, 2.8, 4, 5.6, 8, 11, 16, 22].filter((n) => n >= from && n <= to)
// ───────── 앱 연결 ─────────
// 앱(아이폰·갤럭시·웹)에서 열면 카메라·필름·지금까지의 기록을 넘겨받고, 바뀐 기록을 돌려보낸다.
// 그냥 열면(INIT 없음) 테스트 페이지로 동작한다.
const INIT = window.FILMCHEST_METER_INIT || (() => {
  try { const m = location.hash.match(/init=([^&]+)/); return m ? JSON.parse(decodeURIComponent(m[1])) : null } catch { return null }
})()
const HOSTED = !!INIT
const NATIVE_CAM = !!INIT?.nativeCamera
window.meterBias = Number(INIT?.bias) || 0
function meterBias() {
  const n = Number(window.meterBias)
  return Number.isFinite(n) ? n : 0
}
function applyMeterBias(v) {
  if (v == null || !Number.isFinite(v)) return v
  return clamp(v + meterBias(), -4, 22)
}
function post(msg) {
  if (!HOSTED) return
  try {
    if (window.webkit?.messageHandlers?.meter) window.webkit.messageHandlers.meter.postMessage(msg)
    else if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(JSON.stringify(msg))
    else if (window.parent !== window) window.parent.postMessage({ source: 'filmchest-meter', ...msg }, '*')
  } catch {}
}
if (NATIVE_CAM) document.documentElement.classList.add('native')
const CAM_ID = INIT?.camera?.id || 'test-camera'
const cam = {
  modes: ['P', 'A', 'S', 'M'], ap: aps(1.4, 22), sh: stops(1/4000, 8), pLock: 0,
  name: INIT?.camera?.name || '테스트용 카메라',
  iso: INIT?.film?.iso || 400, frames: INIT?.film?.frames || 36,
  film: INIT?.film?.name || 'Kodak Portra 400', filmShort: INIT?.film?.short || 'PORTRA',
  format: INIT?.film?.format || '135', color: INIT?.film?.color || '#f0b43a',
}
const COMPS = Array.from({ length: 13 }, (_, i) => (i - 6) / 3)  // −2 … +2, 1/3스톱
const ISOS = [25, 32, 40, 50, 64, 80, 100, 125, 160, 200, 250, 320, 400, 500, 640, 800, 1000, 1250, 1600, 2000, 2500, 3200, 4000, 5000, 6400]
const MODE_NAME = { P: '자동', A: '조리개 우선', S: '셔터 우선', M: '수동' }
const PHONE_F = 1.8, PHONE_MM = 26

const fmtA = (n) => 'f/' + n
const fmtS = (t) => t >= 1 ? t + '"' : '1/' + Math.round(1 / t)
function fmtC(c) {
  const k = Math.round(c * 3)
  if (!k) return '0'
  const w = Math.floor(Math.abs(k) / 3), r = Math.abs(k) % 3
  return (k > 0 ? '+' : '−') + (w || '') + (r === 1 ? '⅓' : r === 2 ? '⅔' : '')
}
const log2 = Math.log2, clamp = (v, a, b) => Math.min(b, Math.max(a, v))
const $ = (id) => document.getElementById(id)
const sleep = (ms) => new Promise((r) => setTimeout(r, ms))
const nearest = (list, v) => list.reduce((b, x, i) => Math.abs(log2(x / v)) < Math.abs(log2(list[b] / v)) ? i : b, 0)
const effIso = (c) => ISOS[nearest(ISOS, cam.iso / 2 ** c)]
const store = {
  get(k) { try { return localStorage.getItem(k) } catch { return null } },
  set(k, v) { try { localStorage.setItem(k, v) } catch {} },
}

let mode = 'A'
let meterEV = 12, held = false
let spot = { x: .5, y: .5 }
let shots = {}             // 필름 칸 번호 → 기록
let shotCount = 0
let prewind = false
let busy = false, ended = false, flash = false
let hw = null
let zoom = { z: 1, min: 1, max: 4.6, hw: false } // 폰 배율

// ───────── 소리 ─────────
let ac = null
const audio = () => (ac ||= new (window.AudioContext || window.webkitAudioContext)())
function noise(at, dur, freq, gain) {
  const a = audio(), len = Math.ceil(a.sampleRate * dur)
  const buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0)
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3)
  const s = a.createBufferSource(); s.buffer = buf
  const f = a.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 1.4
  const g = a.createGain(); g.gain.value = gain
  s.connect(f).connect(g).connect(a.destination); s.start(a.currentTime + at)
}
const sound = (fn) => { try { fn() } catch {} }
const shutterSound = () => { noise(0, .03, 3200, 1.1); noise(.045, .025, 2400, .8) }
const ratchetSound = () => { for (let i = 0; i < 7; i++) noise(i * .045, .012, 5200, .35) }
const detent = () => { sound(() => noise(0, .008, 6000, .12)); navigator.vibrate?.(4) }

// ───────── 링 (원통 투영) ─────────
class Ring {
  constructor(el, fmt, step) {
    Object.assign(this, { el, fmt, step, pos: 0, target: 0, vel: 0, auto: false, dragging: false, values: [], labEls: [] })
    el.innerHTML = '<div class="ridges"></div><div class="labels"></div><div class="mark"></div><div class="shade"></div>'
    const ridges = el.querySelector('.ridges')
    this.labels = el.querySelector('.labels')
    this.ridgeEls = Array.from({ length: 90 }, () => ridges.appendChild(Object.assign(document.createElement('div'), { className: 'ridge' })))
    this.bind()
    const loop = () => { this.tick(); requestAnimationFrame(loop) }
    requestAnimationFrame(loop)
  }
  setValues(values, start) {
    this.values = values
    this.labels.innerHTML = ''
    this.labEls = values.map((v) => this.labels.appendChild(Object.assign(document.createElement('div'), { className: 'lab', textContent: this.fmt(v) })))
    this.pos = this.target = clamp(start, 0, values.length - 1)
    this.lastIdx = undefined
  }
  get index() { return Math.round(clamp(this.pos, 0, this.values.length - 1)) }
  get value() { return this.values[this.index] }
  set(i) { this.target = clamp(i, 0, this.values.length - 1) }
  bind() {
    let x0 = 0, p0 = 0, lastX = 0, lastT = 0, moved = 0
    this.el.addEventListener('pointerdown', (e) => {
      if (this.auto) { this.onLocked?.(); return }
      this.dragging = true; this.el.setPointerCapture(e.pointerId)
      x0 = lastX = e.clientX; p0 = this.pos; lastT = performance.now(); moved = 0; this.vel = 0
    })
    this.el.addEventListener('pointermove', (e) => {
      if (!this.dragging) return
      const R = this.el.clientWidth / 2
      moved = Math.max(moved, Math.abs(e.clientX - x0))
      this.pos = clamp(p0 - (e.clientX - x0) / (R * this.step), -.4, this.values.length - .6)
      const now = performance.now()
      this.vel = -(e.clientX - lastX) / (R * this.step) / Math.max(1, now - lastT) * 16
      lastX = e.clientX; lastT = now
    })
    const up = (e) => {
      if (!this.dragging) return
      this.dragging = false
      if (moved < 5) {
        const R = this.el.clientWidth / 2, rect = this.el.getBoundingClientRect()
        const s = clamp((e.clientX - rect.left - R) / (R * .96), -.99, .99)
        this.target = clamp(Math.round(this.pos + Math.asin(s) / this.step), 0, this.values.length - 1)
      } else {
        this.target = clamp(Math.round(this.pos + this.vel * 6), 0, this.values.length - 1)
      }
    }
    this.el.addEventListener('pointerup', up)
    this.el.addEventListener('pointercancel', up)
  }
  tick() {
    if (!this.values.length) return
    if (!this.dragging) this.pos += (this.target - this.pos) * (this.auto ? .12 : .22)
    const idx = this.index
    if (idx !== this.lastIdx) { if (this.lastIdx !== undefined && !this.auto) detent(); this.lastIdx = idx; this.onChange?.() }
    const R = this.el.clientWidth / 2 * .96, c = this.el.clientWidth / 2
    this.labEls.forEach((el, i) => {
      const th = (i - this.pos) * this.step

  if (f.shutter && f.shutter <= 1 / 500) out.add('액션')
  if ((f.filters || []).some((x) => x.startsWith('ND'))) out.add('풍경')
  return out
}
function renderSheet() {
  document.querySelectorAll('#shModes button').forEach((b) => b.classList.toggle('on', b.dataset.m === draft.mode))
  const needA = draft.mode === 'A' || draft.mode === 'M', needS = draft.mode === 'S' || draft.mode === 'M'
  $('shA').hidden = !needA; $('shS').hidden = !needS
  if (needA) chipRow($('shAChips'), cam.ap, draft.aperture, fmtA, (v) => { draft.aperture = v; renderSheet() })
  if (needS) chipRow($('shSChips'), cam.sh, draft.shutter, fmtS, (v) => { draft.shutter = v; renderSheet() })
  document.querySelectorAll('#shFlash button').forEach((b) => b.classList.toggle('on', (b.dataset.v === '1') === !!draft.flash))
  chipRow($('shCChips'), COMPS, draft.comp, (c) => c ? `${fmtC(c)} (ISO ${effIso(c)})` : '0', (v) => { draft.comp = v; renderSheet() })
  filterChips($('shFChips'), draft.filters || [], (list) => { draft.filters = list; renderSheet() })
  const rec = suggestTags(draft), tags = draft.tags || []
  const el = $('shTags'); el.innerHTML = ''
  ;[...TAGS.filter((t) => rec.has(t)), ...TAGS.filter((t) => !rec.has(t))].forEach((t) => {
    const b = document.createElement('button')
    b.innerHTML = rec.has(t) ? `${t}<small>추천</small>` : t
    b.classList.toggle('on', tags.includes(t)); b.classList.toggle('rec', rec.has(t) && !tags.includes(t))
    b.addEventListener('click', () => { draft.tags = tags.includes(t) ? tags.filter((x) => x !== t) : [...tags, t]; renderSheet() })
    el.appendChild(b)
  })
  if (document.activeElement !== $('shMemo')) $('shMemo').value = draft.memo || ''
}
$('shMemo').addEventListener('input', (e) => { if (draft) draft.memo = e.target.value })
// 필터 칩 (여러 개 고를 수 있음, '없음'은 전부 해제)
function filterChips(el, list, onChange) {
  el.innerHTML = ''
  const none = document.createElement('button'); none.textContent = '없음'; none.classList.toggle('on', !list.length)
  none.addEventListener('click', () => onChange([])); el.appendChild(none)
  for (const f of FILTERS) {
    const b = document.createElement('button')
    b.innerHTML = `${f.id}<small>${fmtStops(f.stops)}</small>`
    b.classList.toggle('on', list.includes(f.id))
    b.addEventListener('click', () => onChange(list.includes(f.id) ? list.filter((x) => x !== f.id) : [...list, f.id]))
    el.appendChild(b)
  }
}
function setFilters(list) {
  filters = list
  const on = list.length > 0
  $('filterBtn').classList.toggle('on', on)
  $('filterBtn').querySelector('span').textContent = on ? (list.length > 1 ? `${list[0]}+${list.length - 1}` : list[0]) : '필터'
}
$('filterBtn').addEventListener('click', () => {
  const render = () => filterChips($('fChips'), filters, (list) => { setFilters(list); render() })
  render(); showSheet('filterSheet')
})
$('fDone').addEventListener('click', () => {
  closeSheets()
  if (filters.length) toast(`${filters.join(' + ')} · 노출 ${fmtStops(filterStops(filters))}스톱 반영`)
})
document.querySelectorAll('#shModes button').forEach((b) => b.addEventListener('click', () => {
  const m = b.dataset.m
  draft.mode = m
  const E = draft.ev + log2(effIso(draft.comp) / 100)
  if ((m === 'A' || m === 'M') && !draft.aperture) draft.aperture = cam.ap[nearest(cam.ap, 8)]
  if ((m === 'S' || m === 'M') && !draft.shutter) draft.shutter = cam.sh[nearest(cam.sh, (draft.aperture || 8) ** 2 / 2 ** E)]
  renderSheet()
}))
document.querySelectorAll('#shFlash button').forEach((b) => b.addEventListener('click', () => { draft.flash = b.dataset.v === '1'; renderSheet() }))
$('shSave').addEventListener('click', () => {
  const d = draft
  if (!(d.mode === 'A' || d.mode === 'M')) d.aperture = null
  if (!(d.mode === 'S' || d.mode === 'M')) d.shutter = null
  shots[editing] = { ...d, edited: true }
  renderCell(editing); sendShots(); toast(`${label(editing)}번 컷을 고쳤어요`); closeSheets()
})
$('shCancel').addEventListener('click', closeSheets)
$('endBtn').addEventListener('click', () => {
  if (!shotCount) { toast('아직 찍은 컷이 없어요'); return }
  $('endMeta').textContent = `${shotCount}컷 기록했어요. 끝내면 이 롤은 촬영 완료로 넘어가요.`
  showSheet('endSheet')
})
$('endCancel').addEventListener('click', closeSheets)
// 되감기: 필름이 왼쪽 필름통 안으로 끝까지 빨려 들어간다. 프리와인딩은 이미 거의 다 들어가 있어서 짧게
async function rewindFilm() {
  busy = true
  winding = true
  const ease = 'cubic-bezier(.55,0,.35,1)'
  const sr = strip.getBoundingClientRect(), tr = track.querySelector('.tongue').getBoundingClientRect()
  const dist = Math.max(0, tr.right - (sr.left + 8)) + strip.clientWidth * 0.2
  // 정순·역순 모두 같은 빠르기: 감을 길이에 비례 (36컷 전체 ≈ 2.6초)
  const dur = clamp(dist / 1.45, 450, 3200)
  strip.style.scrollSnapType = 'none'
  track.style.transition = `transform ${dur}ms ${ease}`
  track.style.transform = `translateX(${-dist}px)`
  const knob = $('rewind'), from = shotCount * (prewind ? -150 : 150)
  knob.style.transition = `transform ${dur}ms ${ease}`
  knob.style.transform = `rotate(${from - dist * .9}deg)`
  $('counterSub').textContent = '되감는 중'
  // 되감기 소리: 처음엔 느리게, 중간엔 빠르게, 끝엔 다시 느리게
  sound(() => {
    if (prewind) return motorSound(dur / 1000)
    const n = 46
    for (let i = 0; i < n; i++) { const u = i / (n - 1), t = (u < .5 ? 2 * u * u : 1 - (-2 * u + 2) ** 2 / 2) * dur / 1000; noise(t, .01, 4600, .22) }
  })
  await sleep(dur + 40)
  // 현상 맡기기 화면이 닫힐 때까지 통 안에 들어간 상태를 유지한다.
  wound = true
  winding = false
  parkWound()
  knob.style.transition = ''
  busy = false
}
function motorSound(dur) {
  const a = audio(), o = a.createOscillator(), g = a.createGain(), f = a.createBiquadFilter()
  o.type = 'sawtooth'; f.type = 'lowpass'; f.frequency.value = 900
  const t = a.currentTime
  o.frequency.setValueAtTime(120, t); o.frequency.linearRampToValueAtTime(180, t + .1)
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.12, t + .05); g.gain.setValueAtTime(.12, t + dur - .08); g.gain.linearRampToValueAtTime(0, t + dur)
  o.connect(f).connect(g).connect(a.destination); o.start(t); o.stop(t + dur)
}
$('endGo').addEventListener('click', async () => {
  // 실제 앱에선 여기서 현상소 맡기기 화면으로 넘어간다. 테스트에선 새 롤로 다시 시작
  ended = true; closeSheets()
  await sleep(250)
  await rewindFilm()
  if (HOSTED) { sendShots(); post({ type: 'end' }); return }
  toast(`${shotCount}컷으로 촬영을 끝냈어요 · 테스트라서 새 롤로 다시 시작해요`)
  setTimeout(startRoll, 600)
})
$('dim').addEventListener('click', () => { if (!$('startSheet').classList.contains('on')) closeSheets() })

// ───────── 시작: 이 카메라가 프리와인딩인지 처음 한 번만 묻고, 다음부터는 기억한 값으로 바로 시작 ─────────
// (실제 앱에선 촬영 중 목록에서 카메라+필름을 골라 들어온다. 테스트에선 새로고침 = 새 롤, ?reset 으로 다시 묻기)
const PREWIND_KEY = `prewind-answer:${CAM_ID}` // 예전 시안이 남긴 값(prewind:)은 답한 걸로 치지 않는다
let stPrewind = null
// 새 롤마다 카메라·필름을 보여주고 시작. 프리와인딩 질문은 이 장비에 처음 한 번만
function openStart() {
  const saved = HOSTED ? (INIT.prewind == null ? null : INIT.prewind ? '1' : '0') : store.get(PREWIND_KEY)
  stPrewind = saved === null ? null : saved === '1'
  $('stAsk').hidden = saved !== null
  $('stKnown').hidden = saved === null
  $('stKnown').textContent = saved === '1' ? '카운트 36 → 1 · 프리와인딩' : '카운트 1 → 36'
  renderStart()
  showSheet('startSheet')
}
function renderStart() {
  document.querySelectorAll('#stCount button').forEach((b) => b.classList.toggle('on', stPrewind !== null && (b.dataset.v === '1') === stPrewind))
  $('stGo').disabled = stPrewind === null
}
document.querySelectorAll('#stCount button').forEach((b) => b.addEventListener('click', () => { stPrewind = b.dataset.v === '1'; renderStart(); detent() }))
$('camMsg').querySelector('button').addEventListener('click', startCamera)
$('stGo').addEventListener('click', () => {
  if (HOSTED) { if (INIT.prewind == null) post({ type: 'prewind', value: stPrewind }) }
  else store.set(PREWIND_KEY, stPrewind ? '1' : '0')
  closeSheets()
  beginRoll(stPrewind)
})
function beginRoll(pw) {
  wound = false
  winding = false
  startCamera() // 누르는 순간에 권한을 물어야 하는 브라우저 대비
  prewind = pw
  shots = {}; shotCount = 0; ended = false
  $('endBtn').disabled = false; $('endBtn').textContent = '촬영 끝내기'
  buildStrip(); setMode(mode)
  $('filmLine').textContent = `${cam.film} · ISO ${cam.iso} · ${cam.frames}컷`
  audio()
  sendShots()
}
const startRoll = openStart
let metering = 'spot' // 'spot' 스팟 | 'center' 중앙 중점 | 'avg' 평균
const METERINGS = ['spot', 'center', 'avg']
function setMetering(m) {
  metering = m
  for (const k of METERINGS) { $('meterMode').classList.toggle(k, k === m); $('finder').classList.toggle(k, k === m) }
  sendSpot()
}
function sendSpot() { if (NATIVE_CAM) post({ type: 'spot', x: spot.x, y: spot.y, mode: metering, avg: metering !== 'spot' }) }
// 파인더 위치를 앱에 알려 카메라 화면을 그 자리에 깐다
let lastFinder = ''
function sendFinder() {
  if (!NATIVE_CAM) return
  const r = $('finder').getBoundingClientRect()
  const key = [r.left, r.top, r.width, r.height].map(Math.round).join(',')
  if (key === lastFinder) return
  lastFinder = key
  post({ type: 'finder', x: r.left, y: r.top, w: r.width, h: r.height })
}
// 앱(아이폰)이 부르는 함수
window.meterNative = {
  ev(v) { nativeEV = v },
  zoomRange(min, max) { zoom = { z: 1, min, max, hw: false, native: true }; setZoom(1, true) },
  error(msg) { camMessage(msg, false) },
}
// 누른 칸으로 바꾼다 (토글 어디를 눌렀는지)
$('meterMode').addEventListener('click', (e) => {
  const r = $('meterMode').getBoundingClientRect()
  const i = clamp(Math.floor((e.clientX - r.left) / r.width * 3), 0, 2)
  if (METERINGS[i] !== metering) { setMetering(METERINGS[i]); detent() }
})

$('flashBtn').addEventListener('click', () => {
  flash = !flash
  $('flashBtn').classList.toggle('on', flash); $('flashBtn').setAttribute('aria-pressed', flash)
  $('flashBtn').querySelector('span').textContent = flash ? '켬' : '끔'
  detent()
  toast(flash ? '플래시 켬 · 끌 때까지 찍는 컷에 기록돼요' : '플래시 끔')
})
$('hold').addEventListener('click', () => {
  held = !held; $('hold').classList.toggle('on', held); $('hold').textContent = held ? '고정됨' : '측광 고정'
  toast(held ? '측광값을 고정했어요 · 구도를 바꾸거나 폰을 내려도 값이 그대로예요' : '고정을 풀었어요 · 다시 실시간으로 재요')
})
// 노란 가이드(.bright: 가운데 64% × 70%) 안에만 스팟을 둔다
function placeSpot(clientX, clientY) {
  const r = $('finder').getBoundingClientRect()
  const x = clamp((clientX - r.left) / r.width, .18, .82)
  const y = clamp((clientY - r.top) / r.height, .15, .85)
  spot = { x, y }
  $('spot').style.left = x * 100 + '%'; $('spot').style.top = y * 100 + '%'
  sendSpot()
}
$('finder').addEventListener('pointerdown', (e) => {
  if (e.target.closest('#zoomDial, #camMsg')) return
  if (metering !== 'spot') return // 중앙·평균 측광은 지점이 없다
  if (e.pointerType === 'touch') return
  const mark = $('spot')
  mark.classList.add('drag')
  placeSpot(e.clientX, e.clientY)
  if (held) { held = false; $('hold').classList.remove('on'); $('hold').textContent = '측광 고정' }
  const move = (ev) => { if (ev.cancelable) ev.preventDefault(); placeSpot(ev.clientX, ev.clientY) }
  const up = () => {
    mark.classList.remove('drag')
    document.removeEventListener('pointermove', move)
    document.removeEventListener('pointerup', up)
    document.removeEventListener('pointercancel', up)
  }
  document.addEventListener('pointermove', move, { passive: false })
  document.addEventListener('pointerup', up)
  document.addEventListener('pointercancel', up)
  audio()
})
$('finder').addEventListener('touchstart', (e) => {
  if (e.target.closest('#zoomDial, #camMsg')) return
  if (metering !== 'spot' || e.touches.length !== 1) return
  if (e.cancelable) e.preventDefault()
  const mark = $('spot')
  mark.classList.add('drag')
  placeSpot(e.touches[0].clientX, e.touches[0].clientY)
  if (held) { held = false; $('hold').classList.remove('on'); $('hold').textContent = '측광 고정' }
  const move = (ev) => {
    if (!ev.touches.length) return
    if (ev.cancelable) ev.preventDefault()
    placeSpot(ev.touches[0].clientX, ev.touches[0].clientY)
  }
  const up = () => {
    mark.classList.remove('drag')
    document.removeEventListener('touchmove', move)
    document.removeEventListener('touchend', up)
    document.removeEventListener('touchcancel', up)
  }
  document.addEventListener('touchmove', move, { passive: false })
  document.addEventListener('touchend', up)
  document.addEventListener('touchcancel', up)
  audio()
}, { passive: false })

let toastT
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2200) }

let lastMeasure = 0, lastFrame = 0
function loop(now) {
  stepZoom(Math.min(.05, (now - (lastFrame || now)) / 1000) || .016); lastFrame = now
  if (!live() && !HOSTED) drawSim()
  sendFinder()
  if (now - lastMeasure > 90) {
    lastMeasure = now
    if (!held) meterEV += (measure() - meterEV) * .35
  }
  const r = solve()
  const target = -clamp(r.diff, -2.15, 2.15) * 24
  needleV = needleV * .78 + (target - needleA) * .09
  needleA += needleV
  $('needle').style.transform = `rotate(${needleA}deg)`
  const st = $('state'), a = Math.abs(r.diff)
  if (a < .34) { st.textContent = '적정'; st.className = 'state ok' }
  else if (r.diff > 0) { st.textContent = `+${a.toFixed(1)} 오버`; st.className = 'state over' }
  else { st.textContent = `−${a.toFixed(1)} 언더`; st.className = 'state under' }
  $('led').classList.toggle('red', a >= 1)
  const c = comp()
  $('ev').textContent = `EV ${meterEV.toFixed(1)} · ISO ${cam.iso}${c ? ` → ${effIso(c)}` : ''}${filters.length ? ` · ${filters.join('+')}` : ''}`
  requestAnimationFrame(loop)
}

// 진짜 접안부처럼 변이 살짝 부푼 둥근 네모, 가장자리는 흐리게
{
  const n = 4.2, pts = []
  for (let i = 0; i < 180; i++) {
    const t = i / 180 * Math.PI * 2, c = Math.cos(t), s = Math.sin(t)
    pts.push(`${(150 + 141 * Math.sign(c) * Math.abs(c) ** (2 / n)).toFixed(1)},${(100 + 92 * Math.sign(s) * Math.abs(s) ** (2 / n)).toFixed(1)}`)
  }
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 200' preserveAspectRatio='none'><filter id='b' x='-10%' y='-10%' width='120%' height='120%'><feGaussianBlur stdDeviation='3.2'/></filter><polygon points='${pts.join(' ')}' fill='white' filter='url(#b)'/></svg>`
  document.documentElement.style.setProperty('--eyepiece', `url("data:image/svg+xml,${encodeURIComponent(svg)}")`)
}
applySimLook()
setMode('A')
ringC.onChange()
setZoom(1, true)
buildStrip()
$('filmLine').textContent = `${cam.film} · ISO ${cam.iso} · ${cam.frames}컷`
addEventListener('resize', () => placeStrip(true))
// 화면 크기가 정해지는 순간(처음 그릴 때 포함) 다음 칸을 가운데로
if (window.ResizeObserver) new ResizeObserver(() => { if (track.children.length) placeStrip(true) }).observe(strip)
startCamera()
// 화면에 카메라·필름 이름 넣기
$('camTitle').textContent = cam.name
$('stCam').textContent = cam.name
$('stFilm').textContent = cam.film
$('stFilmSub').textContent = `ISO ${cam.iso} · ${cam.format} · ${cam.frames}컷`
$('stHint').textContent = `카운트가 ${cam.frames}부터 거꾸로 줄어드는 카메라`
$('canName').textContent = cam.filmShort.toUpperCase().slice(0, 9)
$('canIso').textContent = cam.iso
$('canSub').textContent = `${cam.format}·${cam.frames}`
$('canBand').setAttribute('fill', cam.color)
$('stCanBand').style.background = cam.color
$('filmLine').textContent = `${cam.film} · ISO ${cam.iso} · ${cam.frames}컷`
if (HOSTED) {
  $('backBtn').hidden = false
  $('backBtn').addEventListener('click', () => post({ type: 'close' }))
  $('simCanvas').style.display = 'none'
  const saved = INIT.shots || []
  if (saved.length || INIT.rollPrewind != null) {
    // 찍던 롤 이어서
    prewind = INIT.rollPrewind ?? INIT.prewind ?? false
    shots = {}
    for (const f of saved) shots[f.pos] = { ...f }
    shotCount = saved.length
    buildStrip()
    startCamera()
  } else openStart()
} else {
  const qs = new URLSearchParams(location.search)
  if (qs.has('reset')) { try { localStorage.removeItem(PREWIND_KEY) } catch {} }
  if (qs.has('go')) beginRoll(qs.has('pw')); else startRoll()
}
requestAnimationFrame(loop)
</script>
