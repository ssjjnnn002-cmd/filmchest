# 깃허브에 올릴 때마다 자동 검사: 웹 타입·시험·빌드, 갤럭시 타입, 웹→갤럭시 공통 파일이 맞는지
name: 검사
on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npx vitest run
      - run: npx eslint src
      - run: npx vite build

  galaxy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: galaxy/package-lock.json
      # 웹의 공통 규칙 파일을 고치고 갤럭시로 복사하지 않았으면 여기서 걸린다
      - name: 갤럭시 공통 파일이 웹과 같은지
        run: node scripts/sync-galaxy-core.mjs && git diff --exit-code galaxy/src/core
      - run: npm ci
        working-directory: galaxy
      - run: npx tsc --noEmit -p .
        working-directory: galaxy
