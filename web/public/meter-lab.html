<!doctype html>
<html lang="ko" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#131211">
<title>노출계 시험</title>
<!-- 시험용: 실제 앱의 '촬영 중' 화면을 흉내 낸 페이지. 앱 기록(IndexedDB)은 건드리지 않고, 이 페이지 기록은 이 브라우저에만 남는다 -->
<style>
  :root { --paper: #131211; --card: #201e1c; --ink: #f2eee8; --muted: #9b948c; --faint: #5c5751; --sep: rgb(255 245 235 / .1); --fill: rgb(255 245 235 / .1);
    --safelight: #ef6a43; --safelight-soft: #3b241c; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); }
  body { font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; padding: env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 24px); max-width: 560px; margin: 0 auto; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .test { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 10px 0 0; padding: 6px 6px 6px 12px; border-radius: 10px; background: #2c2417; color: #f3c56b; font-size: 12px; }
  .test button { border: 0; background: #f3c56b; color: #2c2417; font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 8px; }
  .head { display: flex; align-items: center; gap: 8px; padding: 14px 0 12px; }
  .head h1 { flex: 1; margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -.02em; }
  .glass { width: 44px; height: 44px; border-radius: 22px; border: .5px solid var(--sep); background: var(--card); color: var(--safelight); display: grid; place-items: center; }
  .glass svg { width: 22px; height: 22px; }
  .card { background: var(--card); border-radius: 18px; padding: 14px; }
  .main { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; background: none; padding: 0; text-align: left; }
  .art { width: 64px; height: 64px; border-radius: 14px; background: linear-gradient(145deg, #3a3633, #1b1918); display: grid; place-items: center; flex: none; }
  .art svg { width: 36px; height: 36px; color: #cfc4ad; }
  .grow { flex: 1; min-width: 0; }
  .name { display: block; font-size: 18px; font-weight: 700; }
  .film { color: var(--safelight); font-size: 15px; font-weight: 600; }
  .sub { color: var(--muted); font-size: 13px; }
  .trunc { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .actions { display: flex; gap: 8px; margin-top: 12px; }
  .btn { flex: 1; height: 44px; border: 0; border-radius: 12px; font-size: 15px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 5px; white-space: nowrap; }
  .btn.primary { background: var(--safelight); color: #fff; }
  .btn.soft { background: var(--safelight-soft); color: var(--safelight); }
  .btn svg { width: 17px; height: 17px; }
  h2 { font-size: 13px; color: var(--muted); font-weight: 600; margin: 26px 0 8px; }
  .list { background: var(--card); border-radius: 14px; overflow: hidden; }
  .row { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: none; padding: 12px 14px; text-align: left; border-top: .5px solid var(--sep); }
  .row:first-child { border-top: 0; }
  .row .check { width: 20px; color: var(--safelight); font-weight: 700; }
  .row small { display: block; color: var(--muted); font-size: 12px; }
  .note { color: var(--muted); font-size: 12px; margin: 8px 4px 0; }
  /* 홈 화면 앱에선 위 상태 표시줄을 누르면 페이지로 안 가서, 노출계를 그 아래부터 띄운다 (iframe 안에선 safe-area 값을 모름) */
  .overlay { position: fixed; inset: 0; z-index: 50; background: #0b0b0c; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  .overlay iframe { width: 100%; height: 100%; border: 0; display: block; }
  .toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 24px); transform: translate(-50%, 16px); opacity: 0; background: rgb(40 38 36 / .96); color: var(--ink);
    padding: 10px 14px; border-radius: 12px; font-size: 14px; transition: .25s; pointer-events: none; z-index: 60; max-width: calc(100% - 32px); text-align: center; }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<div class="test"><span>시험 화면 · 실제 앱 기록에는 영향 없어요</span><button id="reloadBtn">새로고침</button></div>
<div class="head">
  <h1>촬영 중</h1>
  <button class="glass" id="meterOnly" aria-label="노출계"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 16a8 8 0 0 1 16 0"/><path d="M12 16l4-5"/><circle cx="12" cy="16" r="1.4" fill="currentColor"/></svg></button>
  <button class="glass" aria-label="필름 장착하기" id="plus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
</div>

<div class="card">
  <button class="main" id="mainBtn">
    <div class="art"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="7" width="18" height="12" rx="2.5"/><circle cx="12" cy="13" r="3.6"/><path d="M8 7l1.5-2.5h5L16 7"/></svg></div>
    <div class="grow">
      <b class="name trunc" id="camName"></b>
      <div class="film trunc" id="filmName"></div>
      <div class="sub trunc" id="lensName"></div>
      <div class="sub" id="shotInfo"></div>
    </div>
  </button>
  <div class="actions">
    <button class="btn soft" id="placeBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-6-5.6-6-11a6 6 0 0 1 12 0c0 5.4-6 11-6 11z"/><circle cx="12" cy="10" r="2.2"/></svg>위치 기록</button>
    <button class="btn soft" id="detailBtn">상세 기록</button>
    <button class="btn primary" id="endBtn">촬영 끝내기</button>
  </div>
</div>

<h2>시험용 장비 (실제 앱에서는 등록된 카메라·렌즈로 자동)</h2>
<div class="list" id="presets"></div>
<p class="note">장비를 바꾸면 그 장비의 롤로 바뀌어요. 기록은 장비마다 따로 남아요.</p>

<h2>시험 기록</h2>
<div class="list"><button class="row" id="clearBtn"><span class="grow">이 장비의 시험 기록 지우기</span></button></div>

<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id)
const store = {
  get(k, d) { try { const v = localStorage.getItem('meterLab.' + k); return v == null ? d : JSON.parse(v) } catch { return d } },
  set(k, v) { try { localStorage.setItem('meterLab.' + k, JSON.stringify(v)) } catch {} },
}
const toast = (t) => { const el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(() => el.classList.remove('on'), 2200) }

// 실제 앱의 카메라·렌즈 등록 정보 대신 쓰는 예시 장비
const PRESETS = [
  { id: 'rc35', name: 'Olympus 35 RC', modes: ['S', 'M'], fastest: 500, slowest: 1 / 15, prewind: false,
    lens: { name: 'E.Zuiko 42mm f/2.8 (고정 렌즈)', min: 42, max: 42, open: '2.8', close: '22', fixed: true } },
  { id: 'af600', name: 'Nikon AF600', modes: ['P'], fastest: 250, slowest: 2, prewind: false,
    lens: { name: 'Nikon 28mm f/3.5 (고정 렌즈)', min: 28, max: 28, open: '3.5', close: '22', fixed: true } },
  // X-700의 P 모드: 조리개 링을 최소 조리개에 두면 카메라가 조리개·셔터를 둘 다 정한다
  { id: 'x700', name: 'Minolta X-700', modes: ['P', 'A', 'M'], fastest: 1000, slowest: 4, prewind: false, programAtMinAperture: true,
    lens: { id: 'md50', name: 'MD Rokkor 50mm f/1.7', min: 50, max: 50, open: '1.7', close: '22' },
    // 장비 탭에 등록된 같은 마운트(미놀타 MD) 렌즈들 흉내
    lenses: [
      { id: 'md50', name: 'MD Rokkor 50mm f/1.7', min: 50, max: 50, open: '1.7', close: '22' },
      { id: 'md28', name: 'MD W.Rokkor 28mm f/2.8', min: 28, max: 28, open: '2.8', close: '22' },
      { id: 'md3570', name: 'MD Zoom 35–70mm f/3.5', min: 35, max: 70, open: '3.5', close: '22' },
      { id: 'md135', name: 'MD Tele Rokkor 135mm f/3.5', min: 135, max: 135, open: '3.5', close: '22' },
    ] },
]
const FILM = { name: 'Kodak Portra 400', short: 'PORTRA', iso: 400, format: '135', frames: 36, color: '#f0b43a' }
let pick = store.get('preset', 'x700')
const cur = () => PRESETS.find((p) => p.id === pick) || PRESETS[2]
const rollKey = () => 'roll.' + cur().id
const curLens = () => { const p = cur(), id = store.get('lens.' + p.id, null); return p.lenses?.find((l) => l.id === id) || p.lens }

function render() {
  const p = cur(), roll = store.get(rollKey(), { shots: [], prewind: null })
  $('camName').textContent = p.name
  $('filmName').textContent = FILM.name
  $('lensName').textContent = `${curLens().name}${p.prewind ? ' · 역순 감기' : ''}`
  $('shotInfo').textContent = roll.shots.length ? `기록 ${roll.shots.length}컷` : '아직 기록 없음'
  $('presets').innerHTML = ''
  for (const q of PRESETS) {
    const b = document.createElement('button'); b.className = 'row'
    b.innerHTML = `<span class="check">${q.id === p.id ? '✓' : ''}</span><span class="grow">${q.name}<small>${q.lens.name} · ${q.modes.join('/')} · 1/${q.fastest}${q.prewind ? ' · 역순 감기' : ''}</small></span>`
    b.onclick = () => { pick = q.id; store.set('preset', pick); render() }
    $('presets').append(b)
  }
}

// 노출계 열기: 앱이 넘기는 것과 같은 정보를 넘긴다 (카메라·렌즈·필름·감기 방식·지금까지 기록)
let frame = null
function open(only) {
  const p = cur(), roll = store.get(rollKey(), { shots: [], prewind: null })
  const init = {
    test: true,
    only: only ? 'meter' : undefined,
    camera: { id: 'lab-' + p.id, name: p.name, modes: p.modes, fastest: p.fastest, slowest: p.slowest, programAtMinAperture: !!p.programAtMinAperture, lens: curLens() },
    lenses: p.lenses,
    film: FILM,
    prewind: p.prewind,
    rollPrewind: roll.prewind,
    shots: roll.shots,
  }
  const box = document.createElement('div'); box.className = 'overlay'
  frame = document.createElement('iframe')
  frame.allow = 'camera; autoplay'
  frame.src = `./meter.html?v=${Date.now()}#init=${encodeURIComponent(JSON.stringify(init))}`
  box.append(frame); document.body.append(box)
}
function closeMeter() { frame?.parentElement?.remove(); frame = null; render() }
addEventListener('message', (e) => {
  if (!frame || e.source !== frame.contentWindow || e.data?.source !== 'filmchest-meter') return
  const m = e.data
  if (m.type === 'shots') store.set(rollKey(), { shots: m.shots || [], prewind: !!m.prewind })
  else if (m.type === 'lens' && m.id) store.set('lens.' + cur().id, m.id)
  else if (m.type === 'close') closeMeter()
  else if (m.type === 'end') { store.set(rollKey(), { shots: [], prewind: null }); closeMeter(); toast('실제 앱에선 여기서 현상 맡기기로 넘어가요') }
})

$('meterOnly').onclick = () => open(true)
$('detailBtn').onclick = () => open(false)
$('mainBtn').onclick = () => open(false)
$('placeBtn').onclick = () => toast('시험 화면에선 위치 기록을 하지 않아요')
$('plus').onclick = () => toast('시험 화면에선 필름 장착을 하지 않아요')
$('endBtn').onclick = () => {
  const roll = store.get(rollKey(), { shots: [] })
  if (!roll.shots.length) { toast('아직 기록한 컷이 없어요'); return }
  if (confirm(`${roll.shots.length}컷 기록으로 촬영을 끝낼까요? (시험이라 기록을 지우고 새 롤로 시작해요)`)) { store.set(rollKey(), { shots: [], prewind: null }); render() }
}
$('clearBtn').onclick = () => { if (confirm('이 장비의 시험 기록을 지울까요?')) { store.set(rollKey(), { shots: [], prewind: null }); render(); toast('지웠어요') } }
$('reloadBtn').onclick = async () => {
  try { for (const k of await caches.keys()) await caches.delete(k) } catch {}
  location.replace(location.pathname + '?r=' + Date.now())
}
render()
</script>
</body>
</html>
